<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Параграф</title>
<meta name="description" content="Юридический ассистент: ответы по базе нормативных документов со ссылкой на пункт.">
<meta name="theme-color" content="#f4f3f0">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <button class="brand" id="home" type="button" aria-label="Новый диалог">
    <span class="orb small" aria-hidden="true"></span>
    <span>Параграф</span>
  </button>
  <nav class="bar-actions">
    <button class="pill" id="docsOpen" type="button">Документы</button>
    <button class="icon" id="newChat" type="button" aria-label="Новый диалог" data-tip="Новый диалог">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>
</header>

<main class="stage" id="stage">
  <section class="hero" id="hero">
    <div class="orb big" aria-hidden="true"></div>
    <h1>Что нужно проверить?</h1>
    <p>Отвечаю по договорам, регламентам и законам из базы — со ссылкой на пункт.</p>
  </section>

  <section class="thread" id="thread" aria-live="polite"></section>

  <div class="dock" id="dock">
    <div class="notice" id="notice" hidden></div>
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Спросите о договоре, сроке или норме закона" maxlength="4000" aria-label="Вопрос"></textarea>
      <button class="send" id="send" type="submit" aria-label="Отправить">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
    <div class="suggestions" id="suggestions"></div>
  </div>
</main>

<aside class="sheet" id="sheet" aria-label="Документ" hidden>
  <div class="sheet-inner">
    <header class="sheet-head">
      <div>
        <div class="sheet-kind" id="sheetKind"></div>
        <h2 id="sheetTitle"></h2>
        <div class="sheet-status" id="sheetStatus"></div>
      </div>
      <button class="icon" id="sheetClose" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="sheet-jumps" id="sheetJumps"></div>
    <article class="doc" id="docBody"></article>
  </div>
</aside>

<div class="library" id="library" hidden>
  <div class="library-inner" role="dialog" aria-label="Документы базы знаний">
    <header class="library-head">
      <h2>Документы базы</h2>
      <button class="icon" id="docsClose" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <input class="search" id="docFilter" type="search" placeholder="Найти документ" autocomplete="off">
    <div class="library-grid" id="docList"></div>
  </div>
</div>

<div class="pop" id="pop" role="tooltip" hidden></div>
<div class="veil" id="veil" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
