<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Параграф</title>
<meta name="description" content="Юридический ассистент: ответы по базе нормативных документов со ссылкой на пункт.">
<meta name="theme-color" content="#f3f3f1">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<main class="page" id="page">
  <section class="home" id="home">
    <div class="home__mark" id="heroMark"></div>
    <h1 class="title rise" style="--i:1">Что проверить по документам?</h1>
    <p class="lead rise" style="--i:2">Отвечаю по договорам, регламентам и законам базы — со ссылкой на пункт и сверкой каждого числа.</p>
    <div class="starters" id="starters"></div>
    <button class="btn btn--glass btn--small rise" style="--i:5" id="shuffle" type="button">Другие вопросы</button>
  </section>

  <section class="thread" id="thread" aria-live="polite"></section>

  <footer class="composer" id="dock">
    <div class="notice" id="notice" role="status" hidden></div>
    <div class="composer__wrap">
      <button class="nav-button" id="navButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Разделы">
        <span class="nav-button__glow" aria-hidden="true"><canvas id="navGlow"></canvas></span>
        <span id="navMark"></span>
      </button>
      <form class="composer__row" id="composer" autocomplete="off">
        <div class="composer__field-wrap">
          <textarea id="input" class="composer__field" rows="1" maxlength="4000" aria-label="Вопрос"></textarea>
          <div class="composer__hint" id="hint" aria-hidden="true">Спроси <span class="cycle" id="hintCycle">про аренду</span></div>
        </div>
        <button class="composer__send" id="send" type="submit" aria-label="Отправить">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
        </button>
      </form>
    </div>
    <p class="caption composer__note">Параграф отвечает только по документам базы. Важное сверяй с источником.</p>

    <div class="menu glass" id="menu" role="menu" aria-label="Разделы" hidden>
      <button class="menu__item" role="menuitem" type="button" data-action="new">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg><span>Новый разговор</span>
      </button>
      <button class="menu__item" role="menuitem" type="button" data-action="docs">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5h5.5L15 7v9.5H6z"/><path d="M11.5 3.5V7H15M8.5 10.5h4M8.5 13h4"/></svg><span>Документы базы</span>
      </button>
      <button class="menu__item" role="menuitem" type="button" data-action="about">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 9.2v4M10 6.6v.01"/></svg><span>Как это работает</span>
      </button>
    </div>
  </footer>
</main>

<!-- proof, trace and "how it works": one glass sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header class="sheet__head">
      <span class="caption" id="sheetKind"></span>
      <button class="btn btn--glass btn--icon sheet__close" id="sheetClose" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </header>
    <h2 class="sheet__title" id="sheetTitle"></h2>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- full text of a document -->
<aside class="reader glass" id="reader" aria-label="Документ" hidden>
  <header class="reader__head">
    <div>
      <span class="caption" id="readerKind"></span>
      <h2 class="reader__title" id="readerTitle"></h2>
      <p class="reader__status" id="readerStatus"></p>
    </div>
    <button class="btn btn--glass btn--icon" id="readerClose" type="button" aria-label="Закрыть">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
    </button>
  </header>
  <div class="reader__jumps" id="readerJumps"></div>
  <article class="reader__doc" id="readerDoc"></article>
</aside>

<!-- knowledge base -->
<div class="sheet-backdrop" id="library" hidden>
  <div class="sheet sheet--wide glass" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
    <header class="sheet__head">
      <span class="caption">База знаний</span>
      <button class="btn btn--glass btn--icon" id="libraryClose" type="button" aria-label="Закрыть">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </header>
    <h2 class="sheet__title" id="libraryTitle">Документы базы</h2>
    <div class="library__tools">
      <input class="search" id="docFilter" type="search" placeholder="Найти документ" autocomplete="off" aria-label="Найти документ">
      <div class="filters" id="filters" role="group" aria-label="Тип документа">
        <button class="chip on" type="button" data-cat="">Все</button>
        <button class="chip" type="button" data-cat="company">Компания</button>
        <button class="chip" type="button" data-cat="law">Законы</button>
      </div>
    </div>
    <div class="rows" id="docList"></div>
  </div>
</div>

<div class="pop" id="pop" role="tooltip" hidden></div>
<script src="/static/mark.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
